[workspace]
members = ["."]
resolver = "2"

[package]
name = "ifc-language-server"
version = "0.3.0"
edition = "2024"
build = "build.rs"

[dependencies]
espr = "0.4.0"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.26"
tree-sitter-ifc = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
sha2 = "0.10"
ureq = "3"
