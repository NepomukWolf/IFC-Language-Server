[workspace]
members = ["."]
resolver = "2"

[package]
name = "ifc-language-server"
version = "0.6.0"
edition = "2024"
build = "build.rs"

[dependencies]
espr = "0.4.0"
serde_json = "1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.27"
tree-sitter-ifc = "0.1.0"
time = "0.3"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
sha2 = "0.11"
ureq = "3"
