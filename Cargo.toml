[workspace]
members = ["."]
resolver = "2"

[package]
name = "ifc-language-server"
version = "0.6.0"
edition = "2024"
build = "build.rs"

[dependencies]
espr = "0.4.0"
memchr = "2"
percent-encoding = "2"
serde_json = "1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.27"
tree-sitter-ifc = "0.1.0"
time = "0.3"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = "0.8"
futures = "0.3"
tower = "0.4"
tokio = { version = "1", features = ["test-util"] }

[lib]
bench = false

[[bin]]
name = "ifc-language-server"
path = "src/main.rs"
bench = false

[[bench]]
name = "lsp"
harness = false

[build-dependencies]
sha2 = "0.11"
ureq = "3"

[patch.crates-io]
tree-sitter-ifc = { git = "https://github.com/Amixx/tree-sitter-ifc", rev = "3973552f163939b095da9f76ba1f1c035a1e4a53" }
