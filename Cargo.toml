[workspace]
members = ["."]
resolver = "2"

[package]
name = "ifc-language-server"
version = "0.6.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
espr = "0.4.0"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-ifc = "0.1.0"
time = "0.3"
tracing = { version = "0.1.44", features = ["attributes"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tower-lsp = { version = "0.20", default-features = false, features = ["runtime-agnostic"] }
tokio = { version = "1", features = ["sync"] }
time = { version = "0.3", features = ["wasm-bindgen"] }
uuid = { version = "1", features = ["js"] }
# The browser build installs no tracing subscriber, so its events are compiled out.
tracing = { version = "0.1.44", features = ["max_level_off"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.4"
futures = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["ReadableStream", "WritableStream"] }
console_error_panic_hook = "0.1"

# `wasm-pack build --profile wasm-release`: whole-program optimisation for a smaller, faster module.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1

[build-dependencies]
sha2 = "0.11"
ureq = "3"
