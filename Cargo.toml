[workspace]
members = ["."]
resolver = "2"

[package]
name = "ifc-language-server"
version = "0.6.0"
edition = "2024"
build = "build.rs"

[dependencies]
espr = "0.4.0"
memchr = "2"
percent-encoding = "2"
serde_json = { version = "1", features = ["preserve_order"] }
tower-lsp = "0.20"
tokio = {
    version = "1",
    default-features = false,
    features = ["io-util", "macros", "rt", "sync", "time"],
}
time = "0.3"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["js", "v4"] }

[dev-dependencies]
futures = "0.3"
tower = "0.4"

[build-dependencies]
sha2 = "0.11"
ureq = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
