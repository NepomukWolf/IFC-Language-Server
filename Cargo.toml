[workspace]
members = ["."]
resolver = "2"

[package]
name = "ifc-language-server"
version = "0.6.0"
edition = "2024"
build = "build.rs"

[dependencies]
espr = "0.4.0"
memchr = "2"
percent-encoding = "2"
serde_json = { version = "1", features = ["preserve_order"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.27"
tree-sitter-ifc = "0.1.0"
tree-sitter-language = "0.1"
time = "0.3"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures = "0.3"
tower = "0.4"

[build-dependencies]
sha2 = "0.11"
ureq = "3"

[patch.crates-io]
tree-sitter-ifc = { git = "https://github.com/Amixx/tree-sitter-ifc", rev = "01a6b72a384f9b86c69a464a40aeaadc40ca26bb" }
