name: CI

on:
  push:
    branches: [dev, production]
  pull_request:
    branches: [dev, production]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit dependencies
        run: cargo audit

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

  wasm:
    runs-on: ubuntu-latest

    env:
      # tree-sitter's C sources need a clang with the wasm32 backend.
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
      CFLAGS_wasm32_unknown_unknown: -Wno-error=incompatible-pointer-types -Wno-unused-parameter

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Lint
        run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Build wasm package
        run: wasm-pack build --profile wasm-release --target web --no-pack -- --locked

      - name: Smoke test wasm package
        run: bun wasm/smoke-test.mjs pkg
