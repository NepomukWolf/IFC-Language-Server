name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag points to a commit on production
        run: |
          git fetch origin production:refs/remotes/origin/production
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/production; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on origin/production"
            exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os_name: linux-x86_64
            bin_name: ifc-language-server
            asset_name: ifc-language-server-${{ github.ref_name }}-linux-x86_64.tar.gz
            rustflags: ""

          - runner: windows-2025
            os_name: windows-x86_64
            bin_name: ifc-language-server.exe
            asset_name: ifc-language-server-${{ github.ref_name }}-windows-x86_64.zip
            rustflags: "-C target-feature=+crt-static"

          - runner: macos-14
            os_name: macos-arm64
            bin_name: ifc-language-server
            asset_name: ifc-language-server-${{ github.ref_name }}-macos-arm64.tar.gz
            rustflags: ""

          - runner: macos-15-intel
            os_name: macos-x86_64
            bin_name: ifc-language-server
            asset_name: ifc-language-server-${{ github.ref_name }}-macos-x86_64.tar.gz
            rustflags: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset_name }}" -C target/release "${{ matrix.bin_name }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "target/release/${{ matrix.bin_name }}" `
            -DestinationPath "dist/${{ matrix.asset_name }}"

      - name: Upload packaged asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s globstar nullglob
          assets=(dist/**/*.tar.gz dist/**/*.zip)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
